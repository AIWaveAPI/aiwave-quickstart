name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily drift check: published numbers vs the live public endpoint,
    # across ALL repos in the org (not just this one).
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  claims:
    name: Verify every published catalog number (live endpoint, all repos)
    runs-on: ubuntu-latest
    steps:
      - name: Check out all AIWaveAPI repos into one tree
        uses: actions/checkout@v4
        with:
          path: repos/aiwave-quickstart
      - uses: actions/checkout@v4
        with:
          repository: AIWaveAPI/.github
          path: repos/org-profile
      - uses: actions/checkout@v4
        with:
          repository: AIWaveAPI/aiwave-sdk-python
          path: repos/aiwave-sdk-python
      - uses: actions/checkout@v4
        with:
          repository: AIWaveAPI/aiwave-sdk-node
          path: repos/aiwave-sdk-node
      - uses: actions/checkout@v4
        with:
          repository: AIWaveAPI/aiwave-video-pack
          path: repos/aiwave-video-pack
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan every published number for drift
        # Fails with the exact file:line and the correct value if anything
        # in any repo disagrees with the live public endpoint.
        run: python3 repos/aiwave-quickstart/scripts/verify_claims.py --repo-root repos
      - name: Every model ID in every README exists on the live card
        # A made-up ID is worse than a missing one: developers copy it, get a
        # 404, and leave. This catches invented IDs before they ship.
        run: python3 repos/aiwave-quickstart/scripts/verify_model_ids.py --repo-root repos
      - name: Cost estimator smoke test
        run: python3 repos/aiwave-quickstart/scripts/cost.py --preset chat --model deepseek-v4-flash
      - name: All scripts compile
        run: python3 -m py_compile repos/aiwave-quickstart/scripts/*.py
      - name: verify/sync tools agree (offline, anti-loop guarantee)
        run: python3 repos/aiwave-quickstart/scripts/test_claims_tools.py

  python-examples:
    name: Python examples (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Examples use only the standard library (urllib), so no install step.
      - name: Syntax-check every Python example and script
        run: python3 -m compileall -q examples scripts
      - name: Error-handler branches behave as documented (offline)
        run: python3 scripts/test_error_handlers.py
      - name: Claims tools stay in sync (offline)
        run: python3 scripts/test_claims_tools.py
      - name: Provider setup write/restore path (offline)
        if: matrix.python == '3.12'
        run: |
          python3 scripts/test_aiwave_setup.py
          python3 -m unittest scripts.test_aiwave_setup_safety
      - name: WorkBuddy connector safety (offline)
        run: python3 -m unittest scripts.test_workbuddy_connect
      - name: Video curl JSON and submission safety (offline)
        if: matrix.python == '3.12'
        run: python3 scripts/test_video_curl.py

  python38:
    name: Python examples (3.8 container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-python has no 3.8 build for Ubuntu 26.04.
      - name: Run offline Python 3.8 checks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo python:3.8.20-slim sh -euc '
            python -m compileall -q examples scripts
            python scripts/test_error_handlers.py
            python scripts/test_claims_tools.py
            python -m unittest scripts.test_workbuddy_connect
          '

  node-examples:
    name: Node examples (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check every JS example
        run: |
          shopt -s nullglob
          files=(examples/*.mjs examples/*.js)
          [ ${#files[@]} -gt 0 ] || { echo "ERROR: no JS examples found"; exit 1; }
          for f in "${files[@]}"; do node --check "$f"; done
      - name: Error-handler branches behave as documented (offline)
        run: node scripts/test_error_handlers.mjs
      - name: Shell examples are valid
        run: |
          shopt -s nullglob
          files=(examples/*.sh)
          [ ${#files[@]} -gt 0 ] || { echo "ERROR: no shell examples found"; exit 1; }
          for f in "${files[@]}"; do bash -n "$f"; done
