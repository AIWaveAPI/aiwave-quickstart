name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily drift check: published numbers vs the live public endpoint
    - cron: "17 6 * * *"

jobs:
  claims:
    name: Verify published claims (live endpoint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check README numbers against the live catalog
        run: python3 scripts/verify_claims.py
      - name: Cost estimator smoke test
        run: python3 scripts/cost.py --preset chat --model deepseek-v4-flash
      - name: Model reference generator is syntactically valid
        run: python3 -m py_compile scripts/verify_claims.py scripts/cost.py

  python-examples:
    name: Python examples (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Examples use only the standard library (urllib), so no install step.
      - name: Syntax-check every Python example and script
        run: |
          python3 -m compileall -q examples scripts
      - name: Error-handler branches behave as documented (offline)
        run: python3 scripts/test_error_handlers.py
      - name: Provider setup write/restore path (python 3.11+ has tomllib)
        if: matrix.python == '3.12'
        run: python3 scripts/test_aiwave_setup.py

  node-examples:
    name: Node examples (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check every JS example
        run: |
          for f in examples/*.mjs examples/*.js; do node --check "$f"; done
      - name: Shell examples are valid
        run: |
          for f in examples/*.sh; do bash -n "$f"; done
